apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: goledge-api
  namespace: goledge
  labels:
    app.kubernetes.io/name: goledge
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: goledge-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
