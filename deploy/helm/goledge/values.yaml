replicaCount: 3

image:
  repository: goledge-api
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8082
  targetPort: 8082

resources:
  limits:
    cpu: 250m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

config:
  apiAddress: ":8082"
  logLevel: "info"
  logFormat: "json"
  migrationsPath: "file:///app/migrations"
  dynamoDBTable: "goledge_projections"
  dynamoDBEndpoint: "http://ministack.goledge.svc.cluster.local:4566"
  dynamoDBRegion: "us-east-1"
  awsEndpoint: "http://ministack.goledge.svc.cluster.local:4566"
  awsRegion: "us-east-1"
  snsTopicArn: "arn:aws:sns:us-east-1:000000000000:ledger-events"
  sqsWalletBalanceQueueUrl: "http://ministack.goledge.svc.cluster.local:4566/000000000000/wallet-balance-projection-queue"
  ssmParameterPath: "/goledge"
  awsSSMEnabled: "false"
  otelServiceName: "goledge-api"
  otelEndpoint: "jaeger.goledge.svc.cluster.local:4317"
  otelDisabled: "false"
  metricsEnabled: "true"

secrets:
  databaseUrl: "postgres://ledger:ledger@postgres.goledge.svc.cluster.local:5432/ledger?sslmode=disable"
  awsAccessKeyId: "test"
  awsSecretAccessKey: "test"
