version: "2"

sql:
  - engine: postgresql
    schema:
      - migrations/000001_initial_schema.up.sql
      - migrations/000002_create_wallets.up.sql
    queries:
      - internal/ledger/adapters/postgres/queries
    gen:
      go:
        package: db
        out: internal/ledger/adapters/postgres/generated
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
