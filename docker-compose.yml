services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledger}
      POSTGRES_USER: ${POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledger} -d ${POSTGRES_DB:-ledger}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ministack:
    image: ministackorg/ministack:latest
    restart: unless-stopped
    environment:
      - SERVICES=dynamodb,sns,sqs
    ports:
      - "${DYNAMODB_PORT:-4566}:4566"
    volumes:
      - ministack_data:/var/lib/ministack
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_ministack/health || curl -f http://localhost:4566/health || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  ministack_data:
